<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width-device-width, initial-scale=1.0"/>
        <meta name="description" content="Прототип CRM системы свободных маршрутов"/>
        <style>
            body {
                margin: 0
            }

            #app-shell {
                min-height: 100vh;
                box-sizing: border-box;
                padding: 28px 16px 16px;
                background: #fff;
                color: #131313;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            .app-shell-title {
                margin: 0 0 16px;
                font-size: 22px;
                line-height: 30px;
                font-weight: 600;
            }

            .app-shell-line {
                height: 12px;
                width: 100%;
                max-width: 440px;
                border-radius: 8px;
                margin-bottom: 10px;
                background: linear-gradient(90deg, #ececec 25%, #f7f7f7 50%, #ececec 75%);
                background-size: 220% 100%;
                animation: app-shell-shimmer 1.25s linear infinite;
            }

            .app-shell-line.short {
                max-width: 220px;
            }

            @keyframes app-shell-shimmer {
                0% {
                background-position: 200% 0;
                }

                100% {
                background-position: -200% 0;
                }
            }

        </style>
    </head>
    <body>
        <div id="app">
            <div id="app-shell" aria-hidden="true">
                <h1 class="app-shell-title">Bus 24</h1>
                <div class="app-shell-line"></div>
                <div class="app-shell-line"></div>
                <div class="app-shell-line short"></div>
            </div>
        </div>
        <script type="module" src="/src/app/main.js"></script>
    </body>
</html>
