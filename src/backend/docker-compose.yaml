x-django: &django
  build:
    context: .
    dockerfile: Dockerfile.local
  cap_add:
    - SYS_PTRACE
  stdin_open: true
  tty: true
  volumes:
    - .:/app
  env_file:
      - .env

services:
  backend:
    <<: *django
    ports:
      - 8716:8000

  nginx:
    depends_on:
      - backend
    image: nginx:latest
    ports:
      - 8715:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: /bin/sh -c "nginx -g 'daemon off;'"
    