upstream server_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    
    # Отладочный лог для WebSocket
    access_log /var/log/nginx/ws_access.log;
    error_log /var/log/nginx/ws_error.log debug;

    location / {
        # Проксирование обычных запросов
        proxy_redirect off;
        proxy_pass http://server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Sec-CH-Device-Memory $http_x_sec_ch_device_memory;
        proxy_set_header X-User-Agent $http_x_user_agent;
        proxy_set_header X-Client-IP $http_x_client_ip;
        
        # Обработка preflight OPTIONS запросов - передаем на Django
        if ($request_method = 'OPTIONS') {
            proxy_pass http://server_backend;
        }
    }

    location /ws/ { 
        proxy_http_version 1.1;
        proxy_pass http://server_backend;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Sec-CH-Device-Memory $http_x_sec_ch_device_memory;
        proxy_set_header X-User-Agent $http_x_user_agent;
        proxy_set_header X-Client-IP $http_x_client_ip;

        # ⚡ ОТКЛЮЧЕНИЕ БУФЕРИЗАЦИИ ОТВЕТОВ:
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}